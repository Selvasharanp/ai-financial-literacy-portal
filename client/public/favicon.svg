<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Forest Green -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3F38" />
      <stop offset="50%" stop-color="#14312B" />
      <stop offset="100%" stop-color="#0D221D" />
    </linearGradient>

    <!-- Refined Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="30%" stop-color="#E5C690" />
      <stop offset="70%" stop-color="#D4AF67" />
      <stop offset="100%" stop-color="#A68038" />
    </linearGradient>

    <!-- Subtle Gold Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C690" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#A68038" stop-opacity="0.2" />
    </linearGradient>

    <!-- Soft Gold Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#E5C690" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Forest Green Squircle Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <!-- Subtle Gold Rim -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Wealth Emblem: Intertwined Stylized 'F' + Growth Ascending Pillar + 4-Point Wealth Sparkle -->
  <g filter="url(#goldGlow)">
    <!-- Vertical Pillar of 'F' -->
    <rect x="16" y="15" width="7" height="34" rx="3.5" fill="url(#goldGrad)" />
    <!-- Top Horizontal Bar of 'F' -->
    <rect x="16" y="15" width="23" height="7" rx="3.5" fill="url(#goldGrad)" />
    <!-- Middle Bar of 'F' -->
    <rect x="16" y="28.5" width="16" height="7" rx="3.5" fill="url(#goldGrad)" />

    <!-- Ascending Financial Growth Pillar on Right -->
    <rect x="36" y="31" width="7" height="18" rx="3.5" fill="url(#goldGrad)" />
    <rect x="26" y="39" width="7" height="10" rx="3.5" fill="url(#goldGrad)" />

    <!-- 4-Point FinWise Sparkle at Top-Right -->
    <path d="M47 9 C47 13.8 44.2 16.5 39.5 16.5 C44.2 16.5 47 19.2 47 24 C47 19.2 49.8 16.5 54.5 16.5 C49.8 16.5 47 13.8 47 9 Z" fill="url(#goldGrad)" />
  </g>
</svg>